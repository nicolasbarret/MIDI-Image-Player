name: Build MIDI Video Player for Windows
# Rebuild after correcting the JUCE video playback API
on:
  push:
    branches: [video-midi-player]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package application and FFmpeg runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "MIDI Video Player.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "MIDI Video Player.exe was not generated." }

          New-Item -ItemType Directory -Force -Path "package/MIDI Video Player" | Out-Null
          Copy-Item $exe.FullName "package/MIDI Video Player/"

          # FFmpeg extracts pre-rendered JPEG frame clips and builds the audio waveform.
          $ffmpegArchive = "ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffmpegArchive
          Expand-Archive -Path $ffmpegArchive -DestinationPath "ffmpeg-extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe was not found in the FFmpeg archive." }
          Copy-Item (Join-Path $ffmpegExe.DirectoryName "*") "package/MIDI Video Player/" -Recurse -Force

          Compress-Archive -Path "package/MIDI Video Player" -DestinationPath "MIDI-Video-Player-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Video-Player-Windows-x64
          path: MIDI-Video-Player-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
