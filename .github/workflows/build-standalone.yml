name: Build MIDI Video Player for Windows
# Rebuild after correcting the JUCE video playback API
on:
  push:
    branches: [video-midi-player]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package application and VLC runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "MIDI Video Player.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "MIDI Video Player.exe was not generated." }

          New-Item -ItemType Directory -Force -Path "package/MIDI Video Player" | Out-Null
          Copy-Item $exe.FullName "package/MIDI Video Player/"

          # Bundle the official portable VLC runtime so users do not need to install codecs.
          $vlcArchive = "vlc-win64.zip"
          Invoke-WebRequest -Uri "https://download.videolan.org/pub/videolan/vlc/last/win64/vlc-3.0.24-win64.zip" -OutFile $vlcArchive
          Expand-Archive -Path $vlcArchive -DestinationPath "vlc-extracted" -Force
          $libvlc = Get-ChildItem -Path "vlc-extracted" -Filter "libvlc.dll" -Recurse | Select-Object -First 1
          if (-not $libvlc) { throw "libvlc.dll was not found in the official VLC archive." }
          New-Item -ItemType Directory -Force -Path "package/MIDI Video Player/VLC" | Out-Null
          Copy-Item (Join-Path $libvlc.DirectoryName "*") "package/MIDI Video Player/VLC/" -Recurse -Force

          Compress-Archive -Path "package/MIDI Video Player" -DestinationPath "MIDI-Video-Player-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Video-Player-Windows-x64
          path: MIDI-Video-Player-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
