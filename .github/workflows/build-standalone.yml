name: Build MIDI Player 3.0 for Windows
# Build and package MIDI Player 3.0 after source updates
on:
  push:
    branches: [video-midi-player, video-effects-v3]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package application, FFmpeg and VLC preview runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "MIDI Player 3.0.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "MIDI Player 3.0.exe was not generated." }
          $router = Get-ChildItem -Path "build" -Filter "MIDI Audio Router.exe" -Recurse | Select-Object -First 1
          if (-not $router) { throw "MIDI Audio Router.exe was not generated." }

          New-Item -ItemType Directory -Force -Path "package/MIDI Player 3.0" | Out-Null
          Copy-Item $exe.FullName "package/MIDI Player 3.0/"
          Copy-Item $router.FullName "package/MIDI Player 3.0/"

          # FFmpeg extracts and pre-decodes MIDI clips in the background.
          function Download-WithRetry {
            param([string]$Uri, [string]$Destination)
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Uri -OutFile $Destination -TimeoutSec 180
                return
              } catch {
                Write-Warning "Download failed on attempt $attempt/5: $Uri"
                if ($attempt -eq 5) { throw }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }

          $ffmpegArchive = "ffmpeg-essentials.zip"
          Download-WithRetry -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -Destination $ffmpegArchive
          Expand-Archive -Path $ffmpegArchive -DestinationPath "ffmpeg-extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe was not found in the FFmpeg archive." }
          Copy-Item (Join-Path $ffmpegExe.DirectoryName "*") "package/MIDI Player 3.0/" -Recurse -Force

          # VLC is retained only for source-video preview and marker positioning.
          # MIDI note triggers never call VLC.
          $vlcArchive = "vlc-win64.zip"
          Download-WithRetry -Uri "https://download.videolan.org/pub/videolan/vlc/last/win64/vlc-3.0.24-win64.zip" -Destination $vlcArchive
          Expand-Archive -Path $vlcArchive -DestinationPath "vlc-extracted" -Force
          $libvlc = Get-ChildItem -Path "vlc-extracted" -Filter "libvlc.dll" -Recurse | Select-Object -First 1
          if (-not $libvlc) { throw "libvlc.dll was not found in the official VLC archive." }
          New-Item -ItemType Directory -Force -Path "package/MIDI Player 3.0/VLC" | Out-Null
          Copy-Item (Join-Path $libvlc.DirectoryName "*") "package/MIDI Player 3.0/VLC/" -Recurse -Force

          Compress-Archive -Path "package/MIDI Player 3.0" -DestinationPath "MIDI-Player-3.0-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Player-3.0-Windows-x64
          path: MIDI-Player-3.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
